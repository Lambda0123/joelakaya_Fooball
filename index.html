<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Match Tracker</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f3f6fa;color:#14213d}
header{background:#10479a;color:#fff;padding:24px;text-align:center}h1{margin:0 0 7px;font-size:34px}.sub{opacity:.95}
.container{max-width:1250px;margin:20px auto;padding:0 15px}
.controls,.card{background:#fff;border-radius:15px;box-shadow:0 4px 16px #00000012}
.controls{padding:15px;margin-bottom:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{background:#10479a;color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}
input{padding:10px;border:1px solid #c8d1df;border-radius:8px;min-width:330px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{padding:16px}.card h2{font-size:19px;margin:0;border-bottom:2px solid #ddd;padding-bottom:10px}
.match{padding:12px 0;border-bottom:1px solid #edf0f4}.match:last-child{border:0}.date{font-size:12px;color:#667085}.teams{font-weight:700;margin:5px 0}.comp{font-size:12px;color:#53627a}.score{font-weight:800}
.status{font-size:12px;padding:3px 7px;border-radius:8px;background:#e9eef7;display:inline-block}.live{background:#ffd9d9;color:#a40000}.done{background:#dff5e6;color:#126b32}
.empty{color:#667085;font-size:14px;padding:12px 0}.wide{margin-top:16px}.error{background:#fff4e5;color:#7a4b00;padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px}
@media(max-width:900px){.grid{grid-template-columns:1fr}input{min-width:220px}}
</style>
</head>
<body>
<header><h1>⚽ Football Match Tracker</h1><div class="sub">CAF / CAN · Champions League · Coupe du Monde · Favoris</div></header>
<div class="container">
<div class="controls">
<button onclick="loadAll()">🔄 Actualiser maintenant</button>
<label>Favoris : <input id="fav" value="Gabon,France,Paris Saint-Germain,Barcelona,Germany,Spain"></label>
<span id="last"><small>Connexion au serveur local…</small></span>
</div>
<div id="err"></div>
<div class="grid">
<section class="card"><h2>🌍 Prochains matchs CAF / CAN</h2><div id="caf"></div></section>
<section class="card"><h2>🏆 Champions League</h2><div id="ucl"></div></section>
<section class="card"><h2>🌎 Coupe du Monde</h2><div id="wc"></div></section>
</div>
<section class="card wide"><h2>⭐ Prochains matchs des favoris</h2><div id="favorites"></div></section>
</div>
<script>
let all=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmt=d=>new Date(d).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
function favs(){return document.getElementById("fav").value.split(",").map(x=>x.trim().toLowerCase()).filter(Boolean)}
function saveFav(){localStorage.setItem("favorites",document.getElementById("fav").value)}
function render(list,id){
 const el=document.getElementById(id);
 if(!list.length){el.innerHTML='<div class="empty">Aucun match trouvé dans cette catégorie.</div>';return}
 el.innerHTML=list.slice(0,25).map(m=>{
   const done=/final|termin|ft/i.test(m.status||""), live=/live|mi-temps|half/i.test(m.status||"");
   return `<div class="match"><div class="date">${fmt(m.date)}</div><div class="teams">${esc(m.home)} — ${esc(m.away)}</div><div class="comp">${esc(m.league||"")}</div>${m.hs!==""&&m.hs!=null?`<div class="score">${esc(m.hs)} - ${esc(m.as)}</div>`:""}<span class="status ${live?"live":done?"done":""}">${esc(m.status||"À venir")}</span></div>`;
 }).join("");
}
function renderFavorites(){
 const keys=favs();
 const list=all.filter(m=>keys.some(k=>(m.home+" "+m.away).toLowerCase().includes(k)));
 render(list,"favorites");
}
async function loadAll(){
 document.getElementById("last").textContent="Actualisation…"; document.getElementById("err").innerHTML="";
 try{
   const r=await fetch("/api/matches",{cache:"no-store"});
   if(!r.ok) throw new Error("Serveur local: HTTP "+r.status);
   const data=await r.json(); all=data.matches||[];
   render(data.caf||[],"caf"); render(data.ucl||[],"ucl"); render(data.wc||[],"wc"); renderFavorites();
   document.getElementById("last").textContent="Dernière actualisation : "+new Date().toLocaleTimeString("fr-FR");
 }catch(e){
   document.getElementById("err").innerHTML='<div class="error">⚠️ '+esc(e.message)+'<br>Vérifie que <b>Demarrer_Football_Tracker.bat</b> est bien lancé.</div>';
 }
}
const saved=localStorage.getItem("favorites"); if(saved)document.getElementById("fav").value=saved;
document.getElementById("fav").addEventListener("change",()=>{saveFav();renderFavorites()});
loadAll(); setInterval(loadAll,10*60*1000);
</script>
</body>
</html>
