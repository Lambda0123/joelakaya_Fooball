<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Match Tracker</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}
header{background:#0b3d91;color:#fff;padding:24px;text-align:center}
h1{margin:0 0 8px}.sub{opacity:.9}
.container{max-width:1200px;margin:20px auto;padding:0 15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 3px 14px #0001}
.card h2{font-size:19px;margin-top:0;border-bottom:2px solid #ddd;padding-bottom:10px}
.match{border-bottom:1px solid #eee;padding:12px 0}.match:last-child{border:0}
.date{font-size:12px;color:#667085}.teams{font-weight:700;margin:5px 0}.score{font-weight:800}
.status{font-size:12px;padding:3px 7px;border-radius:8px;background:#e9eef7;display:inline-block}
.live{background:#ffd9d9;color:#a40000}.done{background:#dff5e6;color:#126b32}
.controls{background:#fff;padding:15px;border-radius:14px;margin-bottom:18px}
button{background:#0b3d91;color:#fff;border:0;border-radius:8px;padding:9px 13px;cursor:pointer}
input{padding:9px;border:1px solid #ccd3df;border-radius:8px;width:240px}
small{color:#667085}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>⚽ Football Match Tracker</h1>
<div class="sub">CAF / CAN · Champions League · Coupe du Monde · Favoris</div>
</header>
<div class="container">
<div class="controls">
  <button onclick="loadAll()">🔄 Actualiser maintenant</button>
  <label style="margin-left:10px">Favoris :
    <input id="fav" value="Gabon,France,Paris Saint-Germain,Barcelona,Germany,Spain" onchange="saveFav()">
  </label>
  <span id="last" style="margin-left:10px"><small>Chargement…</small></span>
</div>
<div class="grid">
<section class="card"><h2>🌍 Prochains matchs CAF / CAN</h2><div id="caf"></div></section>
<section class="card"><h2>🏆 Champions League</h2><div id="ucl"></div></section>
<section class="card"><h2>🌎 Coupe du Monde</h2><div id="wc"></div></section>
</div>
<section class="card" style="margin-top:16px"><h2>⭐ Prochains matchs des favoris</h2><div id="favorites"></div></section>
</div>
<script>
const endpoints={
 ucl:"https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard",
 wc:"https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard",
 caf:"https://site.api.espn.com/apis/site/v2/sports/soccer/africa.cup_of_nations/scoreboard"
};
let all=[];
function saveFav(){localStorage.setItem("favorites",document.getElementById("fav").value);renderFavorites();}
function favs(){return (localStorage.getItem("favorites")||document.getElementById("fav").value).split(",").map(x=>x.trim().toLowerCase()).filter(Boolean)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmt(d){return new Date(d).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}
function normalize(data,league){
 return (data.events||[]).map(e=>{
   const c=e.competitions?.[0]||{}, comps=c.competitors||[];
   const h=comps.find(x=>x.homeAway==="home")||comps[0]||{}, a=comps.find(x=>x.homeAway==="away")||comps[1]||{};
   return {league, id:e.id, date:e.date, home:h.team?.displayName||"Équipe", away:a.team?.displayName||"Équipe", hs:h.score, as:a.score, status:e.status?.type?.shortDetail||e.status?.type?.description||""};
 });
}
function render(list,id){
 const el=document.getElementById(id);
 if(!list.length){el.innerHTML="<small>Aucun match trouvé par la source actuellement.</small>";return}
 el.innerHTML=list.slice(0,12).map(m=>{
   const done=/final|termin|ft/i.test(m.status), live=/live|mi-temps|half/i.test(m.status);
   return `<div class="match"><div class="date">${fmt(m.date)}</div><div class="teams">${esc(m.home)} — ${esc(m.away)}</div>${m.hs!=null?`<div class="score">${esc(m.hs)} - ${esc(m.as)}</div>`:""}<span class="status ${live?"live":done?"done":""}">${esc(m.status||"À venir")}</span></div>`;
 }).join("");
}
function renderFavorites(){
 const keys=favs(), list=all.filter(m=>keys.some(k=>(m.home+" "+m.away).toLowerCase().includes(k)));
 render(list,"favorites");
}
async function loadOne(key){
 try{
  const today=new Date(), end=new Date(Date.now()+1000*60*60*24*45);
  const u=endpoints[key]+"?dates="+today.toISOString().slice(0,10)+"-"+end.toISOString().slice(0,10);
  const r=await fetch(u); if(!r.ok) throw new Error("HTTP "+r.status);
  return normalize(await r.json(),key);
 }catch(e){return []}
}
async function loadAll(){
 document.getElementById("last").innerHTML="<small>Actualisation…</small>";
 const [caf,ucl,wc]=await Promise.all([loadOne("caf"),loadOne("ucl"),loadOne("wc")]);
 all=[...caf,...ucl,...wc];
 render(caf,"caf"); render(ucl,"ucl"); render(wc,"wc"); renderFavorites();
 document.getElementById("last").innerHTML="<small>Dernière actualisation : "+new Date().toLocaleTimeString("fr-FR")+"</small>";
}
loadAll();
setInterval(loadAll,15*60*1000);
</script>
</body>
</html>
